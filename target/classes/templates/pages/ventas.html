<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Ventas')}"></head>
<body>
  <div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('ventas')}"></aside>
    <main class="main-content">
      <header class="topbar">
        <button class="btn btn-light d-lg-none" id="menuToggle" aria-label="Abrir menú"><i class="bi bi-list fs-4"></i></button>
        <div>
          <h1 class="page-title">Ventas</h1>
          <p class="page-subtitle">Registro de ventas</p>
        </div>
        <div class="top-actions"><div class="avatar avatar-top">AD</div></div>
      </header>

      <section class="container-fluid px-4 pb-4">
        <div th:replace="~{fragments/alertas :: alertas}"></div>

        <!-- Formulario: registrar venta -->
        <article class="panel-card p-3 mb-4">
          <h5 class="mb-3"><i class="bi bi-cart-plus me-1"></i>Registrar nueva venta</h5>
          <form th:action="@{/ventas/guardar}" method="post">
            <div class="row g-3 align-items-end">
              <div class="col-md-4">
                <label for="clienteId" class="form-label">Cliente *</label>
                <select id="clienteId" name="clienteId" class="form-select" required>
                  <option value="" disabled selected>Seleccione cliente...</option>
                  <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombre}"></option>
                </select>
              </div>
              <div class="col-md-4">
                <label for="productoId" class="form-label">Producto *</label>
                <select id="productoId" name="productoId" class="form-select" required>
                  <option value="" disabled selected>Seleccione producto...</option>
                  <option th:each="p : ${productos}" th:value="${p.id}"
                          th:text="|${p.nombre} — S/ ${#numbers.formatDecimal(p.venta,1,2)} (stock: ${p.stock})|"></option>
                </select>
              </div>
              <div class="col-md-2">
                <label for="cantidad" class="form-label">Cantidad *</label>
                <input id="cantidad" type="number" name="cantidad" min="1" value="1" class="form-control" required>
              </div>
              <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-check-lg me-1"></i>Registrar</button>
              </div>
            </div>
          </form>
        </article>

        <!-- Tabla: historial de ventas -->
        <article class="panel-card">
          <header class="panel-header">
            <div>
              <h5>Historial de ventas</h5>
              <small th:text="|Total vendido: S/ ${#numbers.formatDecimal(totalVentas,1,2)}|"></small>
            </div>
          </header>
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <caption class="visually-hidden">Ventas registradas en el sistema</caption>
              <thead>
                <tr>
                  <th scope="col">N°</th><th scope="col">Fecha</th><th scope="col">Cliente</th>
                  <th scope="col">Cantidad</th><th scope="col">Total</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="v : ${ventas}">
                  <td th:text="${v.id}">1</td>
                  <td th:text="${#temporals.format(v.fecha, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                  <td th:text="${v.cliente.nombre}">Cliente</td>
                  <td th:text="${#aggregates.sum(v.detalles.![cantidad])}">1</td>
                  <td th:text="|S/ ${#numbers.formatDecimal(v.total,1,2)}|">S/ 0.00</td>
                </tr>
                <tr th:if="${#lists.isEmpty(ventas)}">
                  <td colspan="5" class="text-center text-muted py-4">
                    <i class="bi bi-inbox fs-3 d-block mb-2"></i>Aún no hay ventas registradas.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </article>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('menuToggle')?.addEventListener('click', () =>
      document.getElementById('sidebar').classList.toggle('collapsed'));
  </script>
</body>
</html>
